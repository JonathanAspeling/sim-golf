<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimGolf — Course Editor</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="app">
    <aside id="palette">

      <h2>Mode</h2>
      <div id="tool-modes">
        <button class="tool-mode-btn" data-tool="paint">Paint</button>
        <button class="tool-mode-btn" data-tool="fill">Fill</button>
        <button class="tool-mode-btn" data-tool="tee">Tee</button>
        <button class="tool-mode-btn" data-tool="flag">Flag</button>
      </div>

      <hr>

      <h2>Hole Info</h2>
      <div id="hole-info">
        <input type="text" id="hole-name" placeholder="Hole name" maxlength="40"
               autocomplete="off" spellcheck="false">
        <div id="par-row">
          <span class="field-label">Par</span>
          <div id="par-select">
            <button class="par-btn" data-par="3">3</button>
            <button class="par-btn" data-par="4">4</button>
            <button class="par-btn" data-par="5">5</button>
          </div>
        </div>
      </div>

      <hr>

      <h2>Tiles</h2>
      <div id="tile-buttons"></div>

      <hr>

      <h2>Actions</h2>
      <div id="tools">
        <button id="btn-clear">Clear map</button>
        <button id="btn-export">Export JSON</button>
        <button id="btn-import">Import JSON</button>
      </div>

      <div id="hints">
        <p>Left click &mdash; paint / fill / place</p>
        <p>Right drag &mdash; erase</p>
        <p>Middle drag &mdash; pan</p>
        <p>Scroll &mdash; zoom</p>
        <p>Ctrl+Z / Ctrl+Y &mdash; undo / redo</p>
      </div>
    </aside>

    <main id="canvas-container">
      <canvas id="main-canvas"></canvas>
    </main>
  </div>

  <input type="file" id="file-import" accept=".json" style="display:none">
  <script type="module" src="js/main.js"></script>
</body>
</html>
