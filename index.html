<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimGolf — Course Editor</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="app">
    <aside id="palette">
      <h2>Tiles</h2>
      <div id="tile-buttons"></div>

      <hr>

      <h2>Tools</h2>
      <div id="tools">
        <button id="btn-clear" title="Reset the entire map to Out-of-Bounds">Clear map</button>
        <button id="btn-export" title="Download the course as course.json">Export JSON</button>
      </div>

      <div id="hints">
        <p>Left drag &mdash; paint</p>
        <p>Right / middle drag &mdash; pan</p>
        <p>Scroll &mdash; zoom</p>
      </div>
    </aside>

    <main id="canvas-container">
      <canvas id="main-canvas"></canvas>
    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
